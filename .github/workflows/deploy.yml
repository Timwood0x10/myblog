name: Deploy to Timwood0x10.github.io

on:
  push:
    branches: [master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola
      - name: zola build
        run: zola build
      - name: Deploy to Timwood0x10.github.io
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: Timwood0x10/Timwood0x10.github.io
          publish_dir: ./public
          publish_branch: main
