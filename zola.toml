base_url = "https://Timwood0x10.github.io/myblog"
title = "Timwood0x10"
description = "Tim Wood — memory safety, static analysis, and AI infrastructure."
theme = "terminimal"

default_language = "en"
compile_sass = true
minify_html = false
build_search_index = true
generate_feeds = true
feed_filenames = ["rss.xml", "atom.xml"]

taxonomies = [
    {name = "tags", feed = true},
    {name = "series", feed = true},
]

[search]
index_format = "elasticlunr_json"
include_title = true
include_description = true
include_content = true

[markdown]
bottom_footnotes = true
render_emoji = false
external_links_target_blank = true
external_links_no_follow = false
external_links_no_referrer = false
smart_punctuation = false

[markdown.highlighting]
theme = "catppuccin-mocha"

[extra]
accent_color = "green"
background_color = "green"
logo_text = "Timwood0x10"
author = "Tim Wood"
enable_post_view_navigation = true
post_view_navigation_prompt = "Read other posts →"
page_titles = "combined"

series_order = ["memscope-rs", "OmniScope", "goagent"]
series_info = { memscope-rs = { desc = "Rust memory tracing foundation", color = "#5BA3E6" }, OmniScope = { desc = "LLVM IR cross-language safety analysis", color = "#4DD0C8" }, goagent = { desc = "Go AI Agent framework", color = "#B388FF" } }
series_edges = [
  { from = "memscope-rs", to = "OmniScope", label = "foundation for" },
  { from = "OmniScope", to = "goagent", label = "drives tooling" },
]

menu_items = [
    {name = "Log", url = "$BASE_URL/log/memscope-rs"},
    {name = "Archive", url = "$BASE_URL/archive"},
    {name = "Tags", url = "$BASE_URL/tags"},
]
