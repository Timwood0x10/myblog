base_url = "https://Timwood0x10.github.io/myblog"
title = "Timwood0x10"
description = "Tim Wood — memory safety, static analysis, and AI infrastructure."
theme = "terminal-zen"

# ============================================
# terminal-zen — A terminal-themed blog theme
# Built from scratch by Tim Wood
# Cyberpunk aesthetics + neon glow + code rain
# ============================================

default_language = "en"
compile_sass = true
minify_html = false
build_search_index = true
generate_feeds = true
feed_filenames = ["rss.xml", "atom.xml"]

taxonomies = [
    {name = "tags", feed = true},
    {name = "series", feed = true},
]

[search]
index_format = "elasticlunr_json"
include_title = true
include_description = true
include_content = true

[markdown]
bottom_footnotes = true
render_emoji = false
external_links_target_blank = true
external_links_no_follow = false
external_links_no_referrer = false
smart_punctuation = false

[markdown.highlighting]
theme = "catppuccin-mocha"

[extra]
accent_color = "green"
background_color = "green"
logo_text = "Timwood0x10"
author = "Tim Wood"
enable_post_view_navigation = true
post_view_navigation_prompt = "Read other posts →"
page_titles = "combined"

series_order = ["memscope-rs", "OmniScope", "omniscope-rs", "ARES", "CodeTribunal", "decision-archaeology"]
series_info = { memscope-rs = { desc = "Rust memory tracing foundation", color = "#5BA3E6" }, OmniScope = { desc = "LLVM IR cross-language safety analysis", color = "#4DD0C8" }, omniscope-rs = { desc = "Cross-language FFI security analysis — Zig vs. Rust implementation deep dive", color = "#50FA7B" }, ARES = { desc = "Go AI Agent framework — from AHP protocol to self-healing runtimes", color = "#B388FF" }, garbage-code-hunter = { desc = "Multi-language code quality analysis in Rust", color = "#FFB86C" }, CodeTribunal = { desc = "LLM agent code review roundtable", color = "#FF79C6" }, "decision-archaeology" = { desc = "Engineering decisions decoded from source code — across memory safety, FFI boundaries, multi-agent evolution, and a Web3→AI pivot", color = "#F1FA8C" } }
series_edges = [
  { from = "memscope-rs", to = "OmniScope", label = "foundation for" },
  { from = "OmniScope", to = "omniscope-rs", label = "parallel implementation" },
  { from = "OmniScope", to = "ARES", label = "drives tooling" },
  { from = "ARES", to = "CodeTribunal", label = "agent framework for" },
  { from = "memscope-rs", to = "decision-archaeology", label = "inspired" },
  { from = "ARES", to = "decision-archaeology", label = "inspired" },
  { from = "CodeTribunal", to = "decision-archaeology", label = "inspired" },
  { from = "garbage-code-hunter", to = "decision-archaeology", label = "inspired" },
  { from = "OmniScope", to = "decision-archaeology", label = "inspired" },
  { from = "omniscope-rs", to = "decision-archaeology", label = "inspired" },
]

menu_items = [
    {name = "Log", url = "$BASE_URL/log/"},
    {name = "Archive", url = "$BASE_URL/archive"},
    {name = "Tags", url = "$BASE_URL/tags"},
]
