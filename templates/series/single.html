{% extends "index.html" %}

{%- block title -%}
{% set title = "Series: " ~ term.name %}
{{ title_macros::title(page_title=title, main_title=config.title) }}
{%- endblock -%}

{% block content %}
<div class="post">
  <h1 class="post-title">Series: {{ term.name }}</h1>
  {{ post_macros::list_posts(pages=term.pages) }}
</div>
{% endblock content %}
