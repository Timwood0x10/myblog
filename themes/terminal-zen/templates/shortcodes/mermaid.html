{%- set diagram_name = name | default(value="graph.mmd") -%}
{%- if page and page.taxonomies and page.taxonomies.series -%}
  {%- set series_slug = page.taxonomies.series[0] | slugify -%}
<div class="mermaid-direct" data-series="{{ series_slug }}" data-name="{{ diagram_name }}">
{{ body | safe }}
</div>
{%- else -%}
<div class="mermaid-direct" data-name="{{ diagram_name }}">
{{ body | safe }}
</div>
{%- endif -%}
